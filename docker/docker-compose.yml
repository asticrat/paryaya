version: "3.9"

volumes:
  redis_data:

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: paryaya-api:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../checkpoints:/app/checkpoints:ro
      - ../data/vocab:/app/data/vocab:ro
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  worker:
    image: paryaya-api:latest
    command: >
      celery -A paryaya.api.worker worker
      --concurrency=4
      --loglevel=info
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../checkpoints:/app/checkpoints:ro
      - ../data/vocab:/app/data/vocab:ro
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

model:
  d_model: 256
  num_enc: 12
  num_dec: 4
  num_heads: 4
  dropout: 0.1

training:
  batch_size: 16
  epochs: 50
  warmup_steps: 2000
  ctc_weight: 0.3
  label_smooth: 0.1
  gradient_clip: 5.0
  mixed_precision: true

data:
  sample_rate: 16000
  n_mels: 80
  max_duration: 30.0
  min_duration: 0.5

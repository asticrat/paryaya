model:
  d_model: 512
  num_enc: 18
  num_dec: 6
  num_heads: 8
  dropout: 0.1

training:
  batch_size: 32
  epochs: 100
  warmup_steps: 4000
  ctc_weight: 0.3
  label_smooth: 0.1
  gradient_clip: 5.0
  mixed_precision: true

data:
  sample_rate: 16000
  n_mels: 80
  max_duration: 30.0
  min_duration: 0.5
